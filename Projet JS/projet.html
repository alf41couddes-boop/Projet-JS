<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PokeProjet</title>
    <link rel="stylesheet" href="projet.css">
    <script src="projet.js" defer></script>
</head>
<body>
    <main class="app">
        <header class="header">
            <div class="logo" aria-hidden="true">
                <div class="pokeball"></div>
            </div>
            <div>
                <h1 class="title">PokeProjet</h1>
                <div class="subtitle">Explore les Pokémon — recherche par nom ou id</div>
            </div>
        </header>

        <div class="toolbar" role="search" aria-label="Recherche de Pokémon">
            <div class="search" style="flex:1">
                <label for="search" class="hidden">Recherche</label>
                <input id="search" name="search" type="text" placeholder="Recherchez un Pokémon (ex: pikachu ou 25)" />
            </div>

            <label for="type-select" class="hidden">Type</label>
            <select id="type-select" aria-label="Filtrer par type">
                <option value="">Tous les types</option>
            </select>

            <label for="region-select" class="hidden">Région</label>
            <select id="region-select" aria-label="Filtrer par région">
                <option value="">Toutes régions</option>
            </select>

            <button id="btn" class="btn" type="button">Rechercher</button>
            <button id="btn-clear" class="btn" type="button" title="Effacer">Effacer</button>
        </div>

        <section id="result" aria-live="polite">
            <p id="p" class="subtitle">Saisis un nom ou un numéro puis clique sur Rechercher.</p>
        </section>

        <section id="answer_area" class="grid" aria-label="Résultats Pokémon">
            <!-- Les cartes Pokémon seront injectées ici par projet.js -->
        </section>

        <!-- Template minimal de carte (clonable via JS) -->
        <template id="card-template">
            <article class="card" role="article">
                <div class="sparkles" aria-hidden="true"></div>
                <div class="head">
                    <div>
                        <div class="poke-name">Nom</div>
                        <div class="subtitle poke-id">#000</div>
                    </div>
                    <div class="rarity">Commun</div>
                </div>

                <div class="poke-media center">
                    <img src="" alt="" />
                </div>

                <div class="types" aria-hidden="true"></div>

                <div class="stats" aria-hidden="true">
                    <div class="stat"><div class="num">0</div><small>PV</small></div>
                    <div class="stat"><div class="num">0</div><small>Atk</small></div>
                    <div class="stat"><div class="num">0</div><small>Def</small></div>
                </div>

                <div class="card-footer">
                    <button class="btn-small">Détails</button>
                    <div class="subtitle">Taille • Poids</div>
                </div>
            </article>
        </template>
    </main>
</body>
</html>
