<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PokeProjet</title>
    <link rel="stylesheet" href="style.css">
    <script src="projet.js" defer></script>
</head>
<body>
    <main class="app">
        <header class="header">
            <div class="logo" aria-hidden="true">
                <div class="pokeball"></div>
            </div>
            <div>
                <h1 class="title">PokeProjet</h1>
                <div class="subtitle">Explore les Pokémon — recherche par nom, id, type ou région</div>
            </div>
        </header>

        <div class="toolbar" role="search" aria-label="Recherche de Pokémon">
            <div class="search" style="flex:1">
                <label for="search" class="hidden">Recherche</label>
                <input id="search" name="search" type="text" placeholder="Recherchez un Pokémon (ex: pikachu ou 25)" />
            </div>
            <button id="btn" class="btn" type="button">Rechercher</button>
        </div>

        <div class="layout">
            <aside class="filters" aria-label="Filtres de recherche">
                <h2 class="filters-title">Filtres</h2>

                <div class="filter-group">
                    <label for="filter-type">Type</label>
                    <select id="filter-type" name="type">
                        <option value="">Tous les types</option>
                        <option value="normal">Normal</option>
                        <option value="fire">Fire</option>
                        <option value="water">Water</option>
                        <option value="electric">Electric</option>
                        <option value="grass">Grass</option>
                        <option value="ice">Ice</option>
                        <option value="fighting">Fighting</option>
                        <option value="poison">Poison</option>
                        <option value="ground">Ground</option>
                        <option value="flying">Flying</option>
                        <option value="psychic">Psychic</option>
                        <option value="bug">Bug</option>
                        <option value="rock">Rock</option>
                        <option value="ghost">Ghost</option>
                        <option value="dragon">Dragon</option>
                        <option value="dark">Dark</option>
                        <option value="steel">Steel</option>
                        <option value="fairy">Fairy</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filter-region">Région</label>
                    <select id="filter-region" name="region">
                        <option value="">Toutes les régions</option>
                        <option value="1">Kanto</option>
                        <option value="2">Johto</option>
                        <option value="3">Hoenn</option>
                        <option value="4">Sinnoh</option>
                        <option value="5">Unova</option>
                        <option value="6">Kalos</option>
                        <option value="7">Alola</option>
                        <option value="8">Galar</option>
                        <option value="9">Paldea</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filter-generation">Génération</label>
                    <select id="filter-generation" name="generation">
                        <option value="">Toutes les générations</option>
                        <option value="1">Gen I</option>
                        <option value="2">Gen II</option>
                        <option value="3">Gen III</option>
                        <option value="4">Gen IV</option>
                        <option value="5">Gen V</option>
                        <option value="6">Gen VI</option>
                        <option value="7">Gen VII</option>
                        <option value="8">Gen VIII</option>
                        <option value="9">Gen IX</option>
                        
                    </select>
                </div>

                <div class="filter-actions">
                    <button id="apply-filters" class="btn-small">Appliquer</button>
                    <button id="reset-filters" class="btn-small">Réinitialiser</button>
                </div>

            </aside>

            <section class="main-view">
                
                <section id="result" aria-live="polite">
                    <p id="p" class="subtitle">Chargement initial — affichage de tous les Pokémon : </p>
                </section>

                
                                <section id="answer_area" class="grid" aria-label="Résultats Pokémon">

                                        <table id="poke-table" style="width:100%;border-collapse:collapse;margin-top:6px;">
                                            <thead>
                                                <tr>
                                                    <th style="text-align:left;padding:8px;border-bottom:1px solid rgba(10,10,30,0.04)">ID</th>
                                                    <th style="text-align:left;padding:8px;border-bottom:1px solid rgba(10,10,30,0.04)">Nom</th>
                                                    <th style="text-align:left;padding:8px;border-bottom:1px solid rgba(10,10,30,0.04)">Image</th>
                                                </tr>
                                            </thead>
                                            <tbody id="poke-rows"></tbody>
                                        </table>
                                </section>

            </section>
        </div>

        <template id="card-template">
            <article class="card" role="article">
                <div class="sparkles" aria-hidden="true"></div>
                <div class="head">
                    <div>
                        <div class="poke-name">Nom</div>
                        <div class="subtitle poke-id">#000</div>
                    </div>
                </div>

                <div class="poke-media center">
                    <img src="" alt="" />
                </div>

                <div class="types" aria-hidden="true"></div>

                <div class="stats" aria-hidden="true">
                    <div class="stat"><div class="num">0</div><small>PV</small></div>
                    <div class="stat"><div class="num">0</div><small>Atk</small></div>
                    <div class="stat"><div class="num">0</div><small>Def</small></div>
                </div>

                <div class="card-footer">
                    <button class="btn-small">Détails</button>
                    <div class="subtitle">Taille • Poids</div>
                </div>
            </article>
        </template>
    </main>
</body>
</html>
