<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Combat Pokémon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="index.html" class="btn" id="back-btn" style="margin-bottom:12px;display:inline-block;">← Retour à l'accueil</a>
    <div id="inventory">
    <h2>Inventaire</h2>
    <div id="inventory-list"></div>
    </div>

    <h1>Combat Pokémon</h1>
    <div id="combat-container">

        <!-- Pokémon Joueur -->
        <div class="pokemon-side" id="player-side">
            <h2 id="player-name"></h2>
            <img id="player-sprite" class="sprite">

            <div class="hp-row">
                <div class="hp-bar">
                    <div id="player-hp" class="hp-fill"></div>
                </div>
                <div id="player-hp-text" class="hp-text">0/0</div>
            </div>

            <div class="hp-row">
            <div class="xp-bar">
                <div id="player-xp" class="xp-fill">
                </div>
            </div>
                
            <div id="player-level">Lv 1</div>
                
            </div>  
        </div>

        <!-- Pokémon Adversaire -->
        <div class="pokemon-side" id="enemy-side">
            <h2 id="enemy-name"></h2>
            <img id="enemy-sprite" class="sprite">
            <div class="hp-row">
                <div class="hp-bar">
                    <div id="enemy-hp" class="hp-fill"></div>
                </div>
                <div id="enemy-hp-text" class="hp-text">0/0</div>
            </div>
        </div>
    </div>

    <div class="mode-selector"><div id="combat-controls"></div></div>

    <h2>Actions</h2>
    <div id="actions"></div>

    <!-- Conteneur dédié pour les objets (potions / pokeballs) -->
    <div id="itemUseBar"></div>

    <div id="log"></div>

    <script src="projet.js"></script>
    <script src="combatScript.js"></script>
</body>
</html>
